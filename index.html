<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#082719">
<title>AFG TON Miner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#071b11;--panel:#103522;--panel2:#17472d;--green:#91f2a5;--green2:#43c875;--gold:#ffdc83;--muted:#bad4c0;--line:#3c7650;--shadow:0 9px 24px #0003}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#245c39 0,transparent 48%),var(--bg);color:#f2fff5;font-family:Arial,Tahoma,sans-serif;padding-bottom:92px;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:520px;margin:auto;min-height:100vh;overflow:hidden;background:linear-gradient(180deg,#0c2818 0,#071b11 440px)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:17px 14px 14px;background:linear-gradient(115deg,#0c2c1b,#1c4b30);border-bottom:1px solid #3b704a;box-shadow:0 5px 20px #0002}.brand{font-size:16px;font-weight:900;color:#a1f7ae}.brand small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.avatar{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#9bf0a7,#28613d);border:2px solid #9bf0a7;display:grid;place-items:center;font-size:23px;flex-shrink:0;box-shadow:0 0 18px #77e99425}.balance-pill{background:linear-gradient(135deg,#315a38,#173b27);border:1px solid #6b965b;padding:9px 11px;border-radius:12px;color:var(--gold);font-weight:bold;font-size:12px;white-space:nowrap;box-shadow:0 3px 12px #0002}
main{padding:12px 14px}.page{display:none;animation:appear .18s ease}.page.active{display:block}@keyframes appear{from{opacity:.45;transform:translateY(4px)}to{opacity:1;transform:none}}
.hero{border-radius:20px;overflow:hidden;position:relative;min-height:230px;padding:19px 16px;background:linear-gradient(180deg,#75b980 0%,#427f4d 38%,#173c29 100%);border:1px solid #70a56c;box-shadow:0 9px 24px #0003}.sun{position:absolute;left:27px;top:25px;width:43px;height:43px;border-radius:50%;background:#ffe8a0;box-shadow:0 0 30px #ffe8a055}.mountain{position:absolute;bottom:0;width:0;height:0;border-left:130px solid transparent;border-right:130px solid transparent;border-bottom:150px solid #245a39}.m1{left:-80px;border-bottom-color:#2c6842}.m2{left:70px;border-left-width:170px;border-right-width:170px;border-bottom:190px solid #19472f}.m3{right:-90px;border-left-width:160px;border-right-width:160px;border-bottom:135px solid #34774a}.mine-entrance{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100px;height:85px;background:#0a2519;border-radius:48px 48px 0 0;border:5px solid #56855b;border-bottom:0}.mine-light{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);width:35px;height:35px;border-radius:50%;background:#e8c86c;box-shadow:0 0 35px #edcf75}.worker{position:absolute;bottom:44px;left:calc(50% - 17px);font-size:39px;filter:drop-shadow(0 4px 3px #0008)}.hero-content{position:relative;z-index:2;max-width:68%;text-shadow:0 2px 8px #143e25}.eyebrow{font-size:11px;color:#e3f9e5}.hero h1{font-size:23px;margin:9px 0;color:white}.hero p{font-size:12px;line-height:1.8;margin:0;color:#efffee}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 2px 12px}.section-head h2{font-size:16px;margin:0}.muted{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.stat,.panel,.miner-card,.task-card,.level-card{background:linear-gradient(145deg,#19482f,#0e3020);border:1px solid #3b704b;border-radius:17px;box-shadow:var(--shadow)}.stat{padding:14px}.stat .label{font-size:11px;color:var(--muted)}.stat .value{font-size:19px;font-weight:900;margin-top:9px;color:#f4fff5}.stat .value small{font-size:11px;color:var(--green)}.miner-card{padding:0;overflow:hidden;margin-top:12px}.miner-art{min-height:145px;position:relative;display:flex;align-items:center;justify-content:center;gap:17px;background:radial-gradient(ellipse at 50% 100%,#4b8d4d 0%,transparent 60%),linear-gradient(145deg,#2c6740,#102f20)}.miner-art:before,.miner-art:after{content:"";position:absolute;bottom:0;width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:80px solid #3b7948;opacity:.6}.miner-art:before{left:-25px}.miner-art:after{right:-25px;border-bottom-color:#214b32}.miner-icon{font-size:64px;z-index:1;filter:drop-shadow(0 5px 5px #0005)}.crystal{font-size:39px;z-index:1;filter:drop-shadow(0 0 10px #8cf0a455)}.miner-info{padding:16px}.miner-info h3{margin:0;font-size:16px}.flex{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.badge{border-radius:8px;background:#245638;color:#a3f3ad;border:1px solid #3d7650;padding:6px 9px;font-size:11px}.progress{height:9px;background:#092719;border:1px solid #2d5c3b;border-radius:9px;overflow:hidden;margin:12px 0}.progress span{height:100%;display:block;width:1%;background:linear-gradient(
  <section class="page" id="miner"><div class="section-head"><h2>🛠️ مرکز ارتقای ماینر</h2><span class="badge">۱ تا ۱۰۰</span></div><div class="miner-card"><div class="miner-art"><span class="miner-icon">⚙️</span><span class="crystal">💎</span></div><div class="miner-info"><div class="flex"><h3 id="minerTitle">ماینر سطح ۱</h3><span class="badge" id="minerBadge">LV 1</span></div><div class="stats"><div class="stat"><div class="label">قدرت</div><div class="value"><span id="minerPower">0.2</span><small> TH/s</small></div></div><div class="stat"><div class="label">درآمد روزانه</div><div class="value"><span id="minerDaily">5</span><small> سکه</small></div></div></div><hr><div class="flex"><span class="muted">هزینه ارتقا</span><b style="color:var(--gold)">🪙 <span id="upgradeCost">100</span></b></div><div class="btn-row"><button class="btn gold" id="upgradeBtn" onclick="upgrade()" disabled>ارتقا به سطح بعد</button><button class="btn dark" onclick="showPage('levels')">همه سطوح</button></div></div></div><div class="note">هزینه و موجودی باید توسط سرور تأیید شوند.</div></section>
<section class="page" id="levels"><div class="section-head"><h2>🏔️ سطوح ماینر</h2><span class="muted">هر سطح، یک مرحله جدید</span></div><div class="level-grid" id="levelGrid"></div></section>
<section class="page" id="tasks"><div class="section-head"><h2>🎯 وظایف و تیم</h2><span class="badge">پاداش روزانه</span></div><div class="task-card"><div class="task-line"><div class="task-icon">📱</div><div class="task-text"><h3>حضور روزانه</h3><p>پاداش روزانه؛ هر روز یک بار.</p></div><button class="btn small" onclick="claimTask('daily_checkin')">+20 🪙</button></div></div><div class="task-card"><div class="task-line"><div class="task-icon">👥</div><div class="task-text"><h3>دعوت دوستان</h3><p>سیستم تأیید دعوت هنوز فعال نشده است.</p></div><button class="btn small" onclick="copyInvite()">دعوت</button></div></div><div class="task-card"><div class="task-line"><div class="task-icon">⛏️</div><div class="task-text"><h3>پاداش روزانه معدن</h3><p>هر روز یک بار؛ فعلاً نیازمند تأیید سرور است.</p></div><button class="btn small" onclick="claimTask('daily_mining')">+20 🪙</button></div></div><div class="section-head"><h2>👥 تیم من</h2></div><div class="panel" style="padding:14px"><div class="flex"><span>اعضای تأییدشده</span><b id="teamCount">0</b></div><hr><div class="muted">شمارش دعوت واقعی هنوز فعال نشده است.</div><div class="btn-row"><button class="btn" onclick="copyInvite()">کپی لینک دعوت</button></div></div></section>
<section class="page" id="wallet"><div class="section-head"><h2>👛 کیف پول</h2></div><div class="panel center" style="padding:17px"><div class="wallet-symbol">💎</div><div class="muted">موجودی بازی</div><div style="font-size:29px;font-weight:900;margin:10px">🪙 <span id="walletCoins">0</span></div><div class="badge">برداشت واقعی فعال نیست</div><hr><label for="walletAddress" class="muted">آدرس عمومی کیف پول TON (اختیاری)</label><input id="walletAddress" class="input" placeholder="آدرس عمومی کیف پول"><button class="btn" onclick="saveWallet()">ذخیره آدرس</button><div class="note">عبارت بازیابی و کلید خصوصی را هرگز وارد نکن. ثبت آدرس به معنای فعال‌شدن برداشت نیست.</div><p id="walletStatus" class="status"></p></div></section>
<section class="page" id="settings"><div class="section-head"><h2>⚙️ تنظیمات</h2></div><div class="panel" style="padding:15px"><div class="flex"><span>نام بازی</span><b>AFG TON Miner</b></div><hr><div class="flex"><span>وضعیت تلگرام و سرور</span><span class="badge" id="telegramStatus">در حال بررسی</span></div><p class="status" id="loginStatus">در انتظار اتصال…</p><hr><button class="btn" onclick="refreshState()">🔄 همگام‌سازی با سرور</button><div class="note">موجودی و سطح حساب از دیتابیس دریافت می‌شوند.</div></div></section>
</main><nav><div class="nav-inner"><button class="nav-btn active" data-page="home" onclick="showPage('home')"><span>🏠</span>خانه</button><button class="nav-btn" data-page="miner" onclick="showPage('miner')"><span>⛏️</span>ماینر</button><button class="nav-btn" data-page="tasks" onclick="showPage('tasks')"><span>🎯</span>تیم و وظایف</button><button class="nav-btn" data-page="wallet" onclick="showPage('wallet')"><span>👛</span>کیف پول</button><button class="nav-btn" data-page="settings" onclick="showPage('settings')"><span>⚙️</span>تنظیمات</button></div></nav></div>
<script>
'use strict';
const API_URL='https://jqonoyivuwccygikiszw.supabase.co/functions/v1/afg-ton-miner';
const tg=window.Telegram?.WebApp;
const state={coins:0,level:1,walletAddress:''};let connected=false,busy=false;
function power(l){if(l===1)return .2;if(l===2)return .4;return .4*Math.pow(1.2,l-2)}
function income(l){if(l===1)return 5;if(l===2)return 6;return Math.round(6+(l-2)*(794/98))}
function cost(l){if(l===2)return 100;if(l===3)return 120;return Math.round(120*Math.pow(8000/120,(l-3)/97))}
function fmt(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}
function txt(id,v){const e=document.getElementById(id);if(e)e.textContent=v}function render(){const p=power(state.level),d=income(state.level),c=state.level<100?cost(state.level+1):0;['topCoins','coins','walletCoins'].forEach(id=>txt(id,fmt(state.coins)));txt('power',fmt(p));txt('daily',fmt(d));txt('level',state.level);txt('homeBadge','سطح '+state.level);txt('minerName','Green Miner '+state.level);txt('homePower',fmt(p)+' TH/s');txt('homeDaily',fmt(d));txt('minerTitle','ماینر سطح '+state.level);txt('minerBadge','LV '+state.level);txt('minerPower',fmt(p));txt('minerDaily',fmt(d));txt('upgradeCost',state.level>=100?'—':fmt(c));const progress=document.getElementById('homeProgress');if(progress)progress.style.width=state.level+'%';const up=document.getElementById('upgradeBtn');if(up){up.disabled=!connected||busy||state.level>=100||state.coins<c;up.textContent=state.level>=100?'بالاترین سطح':'ارتقا به سطح '+(state.level+1)}const mine=document.getElementById('mineBtn');if(mine)mine.disabled=!connected||busy;const w=document.getElementById('walletAddress');if(w&&document.activeElement!==w)w.value=state.walletAddress||'';renderLevels()}
function renderLevels(){const grid=document.getElementById('levelGrid');if(!grid)return;grid.innerHTML='';for(let l=1;l<=100;l++){const card=document.createElement('div');card.className='level-card';const art=document.createElement('div');art.className='level-art';art.textContent=l<=3?'⛏️':l<=10?'⚙️':l<=30?'💎':l<=60?'🏗️':'🚜';const h=document.createElement('h3');h.textContent='ماینر سطح '+l;const p=document.createElement('p');p.textContent='قدرت: '+fmt(power(l))+' TH/s';const d=document.createElement('p');d.textContent='روزانه: '+fmt(income(l))+' سکه';const b=document.createElement('button');b.className='btn';if(l===state.level){b.textContent='سطح فعلی';b.disabled=true}else if(l<state.level){b.textContent='تکمیل شده';b.disabled=true}else if(l===state.level+1){b.textContent='ارتقا · '+fmt(cost(l))+' 🪙';b.disabled=!connected||busy||state.coins<cost(l);b.onclick=upgrade}else{b.textContent='قفل 🔒';b.disabled=true}card.append(art,h,p,d,b);grid.appendChild(card)}}
function showPage(page){document.querySelectorAll('.page').forEach(e=>e.classList.toggle('active',e.id===page));document.querySelectorAll('.nav-btn').forEach(e=>e.classList.toggle('active',e.dataset.page===page));window.scrollTo({top:0,behavior:'smooth'})}
function showError(err){const m=String(err?.message||err||'UNKNOWN_ERROR');const known={INSUFFICIENT_COINS:'سکه کافی برای ارتقا نداری.',MAX_LEVEL:'ماینر به بالاترین سطح رسیده است.',TASK_ALREADY_CLAIMED:'پاداش امروز را قبلاً گرفته‌ای.',INVALID_TASK:'وظیفه معتبر نیست.',PLAYER_NOT_FOUND:'حساب بازی در سرور پیدا نشد.',INVALID_TELEGRAM_DATA:'اطلاعات ورود تلگرام تأیید نشد.',TELEGRAM_AUTH_EXPIRED:'ورود تلگرام منقضی شده؛ مینی‌اپ را دوباره باز کن.'};alert(known[m]||'خطا: '+m)}
async function api(action='state',taskKey=null){if(!tg?.initData)throw new Error('مینی‌اپ را از داخل ربات تلگرام باز کن.');const body={initData:tg.initData,action};if(taskKey)body.taskKey=taskKey;const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let result;try{result=await res.json()}catch{throw new Error('پاسخ سرور JSON معتبر نیست.')}if(!res.ok)throw new Error(result.error||result.message||'SERVER_ERROR');const data=result.data||result;const player=data.player||data.data?.player;if(!player)throw new Error('اطلاعات بازیکن در پاسخ سرور موجود نیست.');const coins=Number(player.coins),level=Number(player.miner_level);if(!Number.isFinite(coins)||!Number.isInteger(level)||level<1||level>100)throw new Error('اطلاعات حساب معتبر نیست.');state.coins=coins;state.level=level;connected=true;render();return data}.async function runAction(action,taskKey=null){if(busy)return null;busy=true;render();try{return await api(action,taskKey)}catch(e){console.error('AFG TON Miner error:',e);showError(e);return null}finally{busy=false;render()}}
async function collect(){const r=await runAction('mine');if(!r)return;const earned=Number(r.earned||0);alert(earned>0?'استخراج موفق بود؛ '+fmt(earned)+' سکه دریافت کردی.':'فعلاً سکه کامل جدیدی برای دریافت نیست؛ بعداً دوباره امتحان کن.')}
async function upgrade(){if(state.level>=100){alert('ماینر به بالاترین سطح رسیده است.');return}const r=await runAction('upgrade');if(r)alert('ارتقا ثبت شد. سطح فعلی: '+state.level)}
async function claimTask(key){const r=await runAction('claim_task',key);if(r)alert('پاداش ثبت شد: '+fmt(r.earned||0)+' سکه.')}
async function copyInvite(){const link='https://t.me/AFG_TON_Miner_Bot';try{await navigator.clipboard.writeText(link);alert('لینک ربات کپی شد.')}catch(e){prompt('لینک را کپی کن:',link)}}
function saveWallet(){const input=document.getElementById('walletAddress'),address=input.value.trim();state.walletAddress=address;try{localStorage.setItem('afgTonMinerWalletAddress',address);txt('walletStatus',address?'آدرس فقط روی همین دستگاه ذخیره شد؛ برداشت فعال نیست.':'آدرس پاک شد.')}catch(e){txt('walletStatus','ذخیره آدرس در این دستگاه ممکن نشد.')}}
async function refreshState(){txt('telegramStatus','در حال اتصال');txt('loginStatus','در حال دریافت حساب از سرور…');connected=false;render();try{await api('state');txt('telegramStatus','متصل');txt('loginStatus','حساب و موجودی از سرور دریافت شد.')}catch(e){connected=false;txt('telegramStatus','اتصال ناموفق');txt('loginStatus','اتصال انجام نشد؛ گزارش خطای تابع را در Supabase بررسی کن.');console.error(e);render();showError(e)}}
async function start(){try{state.walletAddress=localStorage.getItem('afgTonMinerWalletAddress')||''}catch(e){}render();if(tg){tg.ready();tg.expand()}await refreshState()}start();
</script></body></html>
